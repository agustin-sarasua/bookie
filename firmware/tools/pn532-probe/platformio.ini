; PN532 on a bare ESP32 — no SD card, no audio task, nothing else on any bus.
;
; Pick the bus with -DPN532_PROBE_BUS below. SPI is the default because it is
; the one interface the ESP32 cannot lose at: no clock stretching to outrun
; (which is what kills I2C on this chip) and no ambiguity about which wire
; transmits (which is what makes HSU a guessing game).
[env:spi]
platform      = espressif32@6.4.0
board         = esp32dev          ; plain WROOM-32/32D devkit
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800
monitor_filters = esp32_exception_decoder, time
lib_deps      = adafruit/Adafruit PN532@^1.3.2
build_flags   = -DCORE_DEBUG_LEVEL=1 -DPN532_PROBE_BUS=0

[env:hsu]
extends     = env:spi
build_flags = -DCORE_DEBUG_LEVEL=1 -DPN532_PROBE_BUS=1

[env:i2c]
extends     = env:spi
build_flags = -DCORE_DEBUG_LEVEL=1 -DPN532_PROBE_BUS=2
