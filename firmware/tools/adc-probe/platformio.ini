; GPIO34 / GPIO35 on a bare Lolin D32 — is anything (a divider) driving them?
;
; Both are input-only ADC1 pins with no internal pulls, so an unconnected one
; floats. A divider shows up as a steady voltage; a floating pin drifts and
; follows whatever the ADC sampled before it.
[env:lolin_d32]
platform      = espressif32@6.4.0
board         = lolin_d32
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800
monitor_filters = esp32_exception_decoder, time
build_flags   = -DCORE_DEBUG_LEVEL=1
