; RC522 on a bare ESP32 — no SD card, no audio task, nothing else on the bus.
; The point of this project is that when it fails, there is only one thing it
; can be failing at.
[env:esp32dev]
platform      = espressif32@6.4.0
board         = esp32dev          ; plain WROOM-32/32D devkit
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800
monitor_filters = esp32_exception_decoder, time

build_flags =
  -DCORE_DEBUG_LEVEL=1
  ; 1 MHz rather than the library's 4. A dev board plus dupont jumpers plus a
  ; clone antenna is not a controlled-impedance environment, and a marginal
  ; clock fails exactly like the wiring faults this is meant to find.
  -DMFRC522_SPICLOCK=1000000u

lib_deps = miguelbalboa/MFRC522@^1.4.12
