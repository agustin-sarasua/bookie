; microSD on a bare ESP32 — no reader, no audio, no buttons, nothing else on any bus.
;
; Same pins as firmware/src/config.h. It talks to the card by hand first, so a
; failure says which wire is at fault rather than just "Card Failed", and only
; then asks the SD library to mount it.
[env:lolin_d32]
platform      = espressif32@6.4.0
board         = lolin_d32
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800
monitor_filters = esp32_exception_decoder, time
build_flags   = -DCORE_DEBUG_LEVEL=1
